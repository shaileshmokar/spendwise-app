<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.12"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>
    
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Filter for soft shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="#f0f4ff"/>
  
  <!-- Decorative background blobs -->
  <ellipse cx="150" cy="120" rx="250" ry="200" fill="url(#blueGrad)" opacity="0.06" filter="url(#glow)"/>
  <ellipse cx="650" cy="750" rx="300" ry="250" fill="url(#purpleGrad)" opacity="0.05" filter="url(#glow)"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="1"/>
    </pattern>
    <rect width="800" height="900" fill="url(#grid)"/>
  </g>

  <!-- Main Content Container -->
  <g transform="translate(80, 100)">
    
    <!-- Brand Tag -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#3b82f6" opacity="0.1"/>
      <text x="60" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3b82f6" text-anchor="middle">Smart Finance</text>
    </g>

    <!-- Main Heading -->
    <text x="0" y="100" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#0f172a">
      Track Your Expenses
    </text>
    <text x="0" y="145" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#0f172a">
      Like Never Before
    </text>
    <text x="0" y="185" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">
      Stay on top of your spending with real-time insights,
    </text>
    <text x="0" y="210" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">
      smart categorisation, and beautiful analytics.
    </text>

    <!-- Dashboard Card Mockup -->
    <g transform="translate(0, 250)" filter="url(#shadow)">
      
      <!-- Main Card -->
      <rect width="500" height="420" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
      
      <!-- Card Header -->
      <g transform="translate(30, 25)">
        <rect x="0" y="0" width="140" height="16" rx="4" fill="#cbd5e1" opacity="0.6"/>
        <rect x="0" y="24" width="80" height="10" rx="3" fill="#e2e8f0" opacity="0.6"/>
        
        <!-- Card Action Buttons -->
        <circle cx="420" cy="8" r="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="440" cy="8" r="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      </g>

      <!-- Balance Section -->
      <g transform="translate(30, 90)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">TOTAL BALANCE</text>
        <text x="0" y="32" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#0f172a">$24,850.00</text>
        <rect x="0" y="50" width="120" height="28" rx="14" fill="#10b981" opacity="0.1"/>
        <text x="60" y="69" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">+12.5% this month</text>
      </g>

      <!-- Chart Section -->
      <g transform="translate(30, 175)">
        <!-- Chart Area -->
        <rect x="0" y="0" width="440" height="110" rx="8" fill="#f8fafc"/>
        
        <!-- Grid Lines -->
        <line x1="0" y1="27.5" x2="440" y2="27.5" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1"/>
        <line x1="0" y1="55" x2="440" y2="55" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1"/>
        <line x1="0" y1="82.5" x2="440" y2="82.5" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1"/>
        
        <!-- Bar Chart Bars -->
        <g transform="translate(20, 30)">
          <!-- Bar 1 -->
          <rect x="0" y="45" width="30" height="35" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="0" y="25" width="30" height="55" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 2 -->
          <rect x="55" y="35" width="30" height="45" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="55" y="15" width="30" height="65" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 3 -->
          <rect x="110" y="40" width="30" height="40" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="110" y="5" width="30" height="75" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 4 -->
          <rect x="165" y="50" width="30" height="30" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="165" y="30" width="30" height="50" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 5 -->
          <rect x="220" y="45" width="30" height="35" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="220" y="0" width="30" height="80" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 6 -->
          <rect x="275" y="55" width="30" height="25" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="275" y="20" width="30" height="60" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 7 -->
          <rect x="330" y="48" width="30" height="32" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="330" y="8" width="30" height="72" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
          
          <!-- Bar 8 -->
          <rect x="385" y="52" width="30" height="28" rx="4" fill="url(#blueGrad)" opacity="0.3"/>
          <rect x="385" y="32" width="30" height="48" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
        </g>
      </g>

      <!-- Category Tags -->
      <g transform="translate(30, 315)">
        <!-- Food -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="125" height="55" rx="10" fill="#f1f5f9"/>
          <circle cx="20" cy="27.5" r="10" fill="#ef4444" opacity="0.15"/>
          <circle cx="20" cy="27.5" r="5" fill="#ef4444"/>
          <text x="40" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Food</text>
          <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$245.50</text>
        </g>
        
        <!-- Shopping -->
        <g transform="translate(140, 0)">
          <rect x="0" y="0" width="125" height="55" rx="10" fill="#f1f5f9"/>
          <circle cx="20" cy="27.5" r="10" fill="#8b5cf6" opacity="0.15"/>
          <circle cx="20" cy="27.5" r="5" fill="#8b5cf6"/>
          <text x="40" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Shopping</text>
          <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$432.00</text>
        </g>
        
        <!-- Transport -->
        <g transform="translate(280, 0)">
          <rect x="0" y="0" width="125" height="55" rx="10" fill="#f1f5f9"/>
          <circle cx="20" cy="27.5" r="10" fill="#10b981" opacity="0.15"/>
          <circle cx="20" cy="27.5" r="5" fill="#10b981"/>
          <text x="40" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Transport</text>
          <text x="40" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">$89.00</text>
        </g>
      </g>
      
      <!-- Add Expense Button -->
      <g transform="translate(370, 370)">
        <circle cx="30" cy="30" r="30" fill="url(#blueGrad)" filter="url(#shadow)"/>
        <line x1="30" y1="18" x2="30" y2="42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="18" y1="30" x2="42" y2="30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 720)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="110" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="18" cy="16" r="4" fill="#10b981"/>
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Secure</text>
      </g>
      
      <g transform="translate(125, 0)">
        <rect x="0" y="0" width="130" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="18" cy="16" r="4" fill="#3b82f6"/>
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Analytics</text>
      </g>
      
      <g transform="translate(270, 0)">
        <rect x="0" y="0" width="130" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="18" cy="16" r="4" fill="#8b5cf6"/>
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Insights</text>
      </g>
      
      <g transform="translate(415, 0)">
        <rect x="0" y="0" width="115" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="18" cy="16" r="4" fill="#ef4444"/>
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Real-time</text>
      </g>
    </g>
  </g>
</svg>