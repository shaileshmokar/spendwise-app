<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <!-- Background Pattern -->
  <rect width="800" height="1000" fill="#f8fafc"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#grid)" opacity="0.5"/>

  <!-- Glowing background blobs for SaaS look -->
  <circle cx="200" cy="300" r="250" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>
  <circle cx="600" cy="700" r="300" fill="#10b981" opacity="0.05" filter="blur(60px)"/>

  <!-- Main Dashboard Card Mockup -->
  <g transform="translate(100, 200)">
    <!-- Base Card -->
    <rect width="600" height="600" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" style="filter: drop-shadow(0 20px 25px rgba(0,0,0,0.04));"/>
    
    <!-- Card Header / Title -->
    <rect x="40" y="40" width="180" height="24" rx="6" fill="#e2e8f0"/>
    <rect x="40" y="74" width="100" height="14" rx="4" fill="#f1f5f9"/>
    
    <!-- Main Big Balance Metric -->
    <rect x="40" y="120" width="220" height="48" rx="8" fill="#cbd5e1"/>
    <circle cx="530" cy="70" r="20" fill="#3b82f6" opacity="0.1"/>
    <path d="M524 70h12M530 64v12" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

    <!-- Spending Trend Line Chart Mockup -->
    <g transform="translate(40, 210)">
      <!-- Chart Boundary Box -->
      <rect width="520" height="200" rx="12" fill="#f8fafc" stroke="#f1f5f9"/>
      <!-- Grid lines inside chart -->
      <line x1="0" y1="50" x2="520" y2="50" stroke="#e2e8f0" stroke-dasharray="4 4"/>
      <line x1="0" y1="100" x2="520" y2="100" stroke="#e2e8f0" stroke-dasharray="4 4"/>
      <line x1="0" y1="150" x2="520" y2="150" stroke="#e2e8f0" stroke-dasharray="4 4"/>
      <!-- Trendy Expense Trend Line -->
      <path d="M 30 160 Q 100 120 160 140 T 300 60 T 440 90 T 490 30" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Glowing area under line -->
      <path d="M 30 160 Q 100 120 160 140 T 300 60 T 440 90 T 490 30 L 490 200 L 30 200 Z" fill="#3b82f6" opacity="0.05"/>
      <!-- Active Data Point Dots -->
      <circle cx="300" cy="60" r="6" fill="#3b82f6"/>
      <circle cx="300" cy="60" r="12" fill="#3b82f6" opacity="0.2"/>
    </g>

    <!-- Bottom Category Breakdown Row -->
    <g transform="translate(40, 450)">
      <!-- Category Item 1 (Food) -->
      <rect x="0" y="0" width="150" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="30" cy="30" r="14" fill="#ef4444" opacity="0.1"/>
      <rect x="56" y="24" width="60" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="16" y="60" width="118" height="8" rx="4" fill="#f1f5f9"/>
      <rect x="16" y="60" width="80" height="8" rx="4" fill="#ef4444"/>

      <!-- Category Item 2 (Subscriptions) -->
      <rect x="185" y="0" width="150" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="215" cy="30" r="14" fill="#3b82f6" opacity="0.1"/>
      <rect x="241" y="24" width="60" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="201" y="60" width="118" height="8" rx="4" fill="#f1f5f9"/>
      <rect x="201" y="60" width="95" height="8" rx="4" fill="#3b82f6"/>

      <!-- Category Item 3 (Savings Goal) -->
      <rect x="370" y="0" width="150" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="400" cy="30" r="14" fill="#10b981" opacity="0.1"/>
      <rect x="426" y="24" width="60" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="386" y="60" width="118" height="8" rx="4" fill="#f1f5f9"/>
      <rect x="386" y="60" width="45" height="8" rx="4" fill="#10b981"/>
    </g>
  </g>
</svg>